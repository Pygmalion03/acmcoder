services:
  acmcoder:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: acmcoder-app:local
    ports:
      - "127.0.0.1:43117:43117"
    volumes:
      - ./data/memory:/app/data/memory
      - ./data/recommendation:/app/data/recommendation
      - ./data/unified:/app/data/unified
      - ./credentials:/app/credentials
    environment:
      PORT: "43117"
      ACMCODER_HOST: "0.0.0.0"
      ACMCODER_TRUSTED_HOSTS: "${ACMCODER_TRUSTED_HOSTS:-}"
      ACMCODER_CREDENTIAL_DIR: "/app/credentials"
