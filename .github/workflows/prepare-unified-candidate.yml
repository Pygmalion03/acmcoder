name: Prepare unified candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACMCODER_BUILD_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test and build candidate
        run: |
          npm test
          npm run build:clients
          npm run build:store-assets
          npm run check:release -- --candidate
          npm run pack:release -- --candidate
      - name: Upload candidate ZIP, source, checksums and brand assets
        uses: actions/upload-artifact@v4
        with:
          name: unified-candidate-${{ github.sha }}
          path: |
            dist/releases/
            dist/store-assets/
          if-no-files-found: error
      # This job does not create a Release, publish images, deploy or change latest.
