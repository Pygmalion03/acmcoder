name: Publish container images

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional product tag; must match v plus package.json version.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ACMCODER_BUILD_COMMIT: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Build unified clients and require stable acceptance
        env:
          ACMCODER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_tag }}
        run: |
          npm run build:clients
          npm run check:release

      - name: Read accepted product version
        id: version
        run: node -e 'process.stdout.write("version=" + require("./package.json").version + "\n")' >> "$GITHUB_OUTPUT"

      - name: Build app image for smoke test
        run: docker build --build-arg "ACMCODER_BUILD_COMMIT=$ACMCODER_BUILD_COMMIT" --file Dockerfile.app --tag acmcoder-app:verify .

      - name: Start hardened app container
        run: |
          mkdir -p .ci-data/memory .ci-data/recommendation .ci-data/unified .ci-data/credentials
          chmod 0777 .ci-data/memory .ci-data/recommendation .ci-data/unified .ci-data/credentials
          docker run --detach \
            --name acmcoder-app-verify \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            --volume "$PWD/.ci-data/memory:/app/data/memory" \
            --volume "$PWD/.ci-data/recommendation:/app/data/recommendation" \
            --volume "$PWD/.ci-data/unified:/app/data/unified" \
            --volume "$PWD/.ci-data/credentials:/app/credentials" \
            --publish 127.0.0.1:43117:43117 \
            acmcoder-app:verify

      - name: Smoke test app image
        run: node scripts/smoke-app-image.mjs

      - name: Show app logs on failure
        if: failure()
        run: docker logs acmcoder-app-verify

      - name: Stop smoke container
        if: always()
        run: docker rm --force acmcoder-app-verify || true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile.app
          - name: runner
            dockerfile: Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/acmcoder-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=sha,format=short,prefix=sha-

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ACMCODER_BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
          PRODUCT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p image-manifests
          node -e 'const fs=require("node:fs"); fs.writeFileSync("image-manifests/"+process.env.IMAGE_NAME+".json", JSON.stringify({name:process.env.IMAGE_NAME,version:process.env.PRODUCT_VERSION,commit:process.env.ACMCODER_BUILD_COMMIT,digest:process.env.IMAGE_DIGEST},null,2)+"\n")'

      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}-${{ github.sha }}
          path: image-manifests/

  # latest is deliberately promoted separately only after both images, website,
  # ZIP and source artifacts have been associated and accepted as one release.
