name: Publish container images

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional additional image tag to publish.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Build app image for smoke test
        run: docker build --file Dockerfile.app --tag acmcoder-app:verify .

      - name: Start hardened app container
        run: |
          mkdir -p .ci-data/memory .ci-data/recommendation
          chmod 0777 .ci-data/memory .ci-data/recommendation
          docker run --detach \
            --name acmcoder-app-verify \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            --volume "$PWD/.ci-data/memory:/app/data/memory" \
            --volume "$PWD/.ci-data/recommendation:/app/data/recommendation" \
            --publish 127.0.0.1:43117:43117 \
            acmcoder-app:verify

      - name: Smoke test app image
        run: node scripts/smoke-app-image.mjs

      - name: Show app logs on failure
        if: failure()
        run: docker logs acmcoder-app-verify

      - name: Stop smoke container
        if: always()
        run: docker rm --force acmcoder-app-verify || true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile.app
          - name: runner
            dockerfile: Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/acmcoder-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ github.event.inputs.version_tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
