name: Publish container images

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional product tag; must match v plus package.json version.
        required: false
        default: ""
      promote_stable:
        description: Promote the already published and associated stable release images to latest.
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ACMCODER_BUILD_COMMIT: ${{ github.sha }}

jobs:
  verify:
    if: ${{ !inputs.promote_stable }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Build unified clients and verify the declared release channel
        env:
          ACMCODER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_tag }}
        run: |
          npm run build:clients
          if node -e 'process.exit(require("./package.json").version.includes("-rc.") ? 0 : 1)'; then
            npm run check:release -- --candidate
          else
            npm run check:release
          fi

      - name: Read accepted product version
        id: version
        run: node -e 'process.stdout.write("version=" + require("./package.json").version + "\n")' >> "$GITHUB_OUTPUT"

      - name: Build app image for smoke test
        run: docker build --build-arg "ACMCODER_BUILD_COMMIT=$ACMCODER_BUILD_COMMIT" --file Dockerfile.app --tag acmcoder-app:verify .

      - name: Start hardened app container
        run: |
          mkdir -p .ci-data/memory .ci-data/recommendation .ci-data/unified .ci-data/credentials
          chmod 0777 .ci-data/memory .ci-data/recommendation .ci-data/unified .ci-data/credentials
          docker run --detach \
            --name acmcoder-app-verify \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            --volume "$PWD/.ci-data/memory:/app/data/memory" \
            --volume "$PWD/.ci-data/recommendation:/app/data/recommendation" \
            --volume "$PWD/.ci-data/unified:/app/data/unified" \
            --volume "$PWD/.ci-data/credentials:/app/credentials" \
            --publish 127.0.0.1:43117:43117 \
            acmcoder-app:verify

      - name: Smoke test app image
        run: node scripts/smoke-app-image.mjs

      - name: Show app logs on failure
        if: failure()
        run: docker logs acmcoder-app-verify

      - name: Stop smoke container
        if: always()
        run: docker rm --force acmcoder-app-verify || true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile.app
          - name: runner
            dockerfile: Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/acmcoder-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=sha,format=short,prefix=sha-

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ACMCODER_BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
          PRODUCT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p image-manifests
          node -e 'const fs=require("node:fs"); fs.writeFileSync("image-manifests/"+process.env.IMAGE_NAME+".json", JSON.stringify({name:process.env.IMAGE_NAME,version:process.env.PRODUCT_VERSION,commit:process.env.ACMCODER_BUILD_COMMIT,digest:process.env.IMAGE_DIGEST},null,2)+"\n")'

      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}-${{ github.sha }}
          path: image-manifests/

  promote:
    if: ${{ inputs.promote_stable }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published stable release and associated artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          gh release view "$VERSION_TAG" --json tagName,isDraft,isPrerelease > release-state.json
          gh release download "$VERSION_TAG" --pattern release-manifest.json --dir release-evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json'));
          const release=JSON.parse(fs.readFileSync('release-state.json'));
          const manifest=JSON.parse(fs.readFileSync('release-evidence/release-manifest.json'));
          if(!/^\d+\.\d+\.\d+$/.test(pkg.version)||process.env.VERSION_TAG!==`v${pkg.version}`||release.tagName!==process.env.VERSION_TAG||release.isDraft||release.isPrerelease)throw new Error('A published stable release at this tag is required');
          if(manifest.version!==pkg.version||manifest.commit!==process.env.GITHUB_SHA||manifest.channel!=='stable'||manifest.website.status!=='accepted'||manifest.website.commit!==manifest.commit||manifest.images.status!=='accepted')throw new Error('Release associations are incomplete');
          for(const name of ['app','runner']){
            const image=manifest.images[name];
            if(image.version!==pkg.version||image.commit!==manifest.commit||!/^sha256:[a-f0-9]{64}$/.test(image.digest))throw new Error('Image association differs');
            fs.appendFileSync(process.env.GITHUB_ENV,`${name.toUpperCase()}_DIGEST=${image.digest}\n`);
          }
          for(const name of [`acmcoder-source-v${pkg.version}.tar.gz`,`acmcoder-extension-v${pkg.version}.zip`])if(!manifest.artifacts.some(a=>a.name===name&&/^[a-f0-9]{64}$/.test(a.sha256)))throw new Error('Source and extension artifacts are required');
          if(Object.values(manifest.acceptance.checks).some(c=>c.status!=='passed'||!c.evidence))throw new Error('Acceptance is incomplete');
          JS
      - name: Verify both public version tags before changing either latest tag
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p promotion-evidence
          for name in app runner; do
            digest_var="${name^^}_DIGEST"
            expected="${!digest_var}"
            actual="$(docker buildx imagetools inspect "ghcr.io/$owner/acmcoder-$name:$VERSION_TAG" --format '{{.Manifest.Digest}}')"
            test "$actual" = "$expected"
            docker buildx imagetools inspect "ghcr.io/$owner/acmcoder-$name:latest" --format '{{.Manifest.Digest}}' > "promotion-evidence/$name-previous-latest.txt"
          done
      - name: Promote accepted digests without rebuilding
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for name in app runner; do
            digest_var="${name^^}_DIGEST"
            digest="${!digest_var}"
            docker buildx imagetools create --tag "ghcr.io/$owner/acmcoder-$name:latest" "ghcr.io/$owner/acmcoder-$name@$digest"
            actual="$(docker buildx imagetools inspect "ghcr.io/$owner/acmcoder-$name:latest" --format '{{.Manifest.Digest}}')"
            test "$actual" = "$digest"
            printf '%s\n' "$actual" > "promotion-evidence/$name-current-latest.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: stable-promotion-${{ github.sha }}
          path: promotion-evidence/
