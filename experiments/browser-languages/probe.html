<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACMCoder 浏览器语言实验</title>
<style>body{font:16px system-ui;max-width:1100px;margin:30px auto;padding:20px;background:#eef1ff;color:#20243d}button,select{font:inherit;padding:9px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px;border-radius:16px}small{display:block;margin:15px 0}</style>
<h1>浏览器语言实验</h1>
<p>仅执行已知实验样例，不接入产品编辑器。编译用户新源码必须发生在浏览器 Worker。</p>
<select aria-label="语言"><option value="cpp">C++ / Clang 22</option><option value="java">Java / Doppio 0.5</option></select>
<label><input id="isolation" type="checkbox"> C++ 隔离帧</label>
<button id="basic">基础编译运行</button><button id="suite">完整候选实验</button><button id="cancel">停止</button><button id="export">导出结果</button>
<small id="heartbeat">主线程心跳等待中</small>
<pre id="status" role="status">等待启动</pre>
<pre id="results" aria-label="实验结果"></pre>
<script type="module" src="./probe.js"></script>
</html>
