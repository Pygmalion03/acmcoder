<h1>真实浏览器备份一致性</h1>
<p>使用产品的 BrowserStore 和浏览器原生 IndexedDB。只在随机命名的验收空间写入自建题目，两个独立存储实例并发导出和重写。不会连接云端、读取学习空间或配置密钥。</p>
<p>这验证实际存储事务，不替代真实账号恢复或产品界面中的并发编辑验收。</p>
<button id="run">执行 20 轮并发检查</button><button id="export" disabled>下载验收结果</button>
<pre id="status" role="status">等待启动</pre><pre id="result" aria-label="验收结果"></pre>
<script type="module" src="./probe.js"></script></html>
